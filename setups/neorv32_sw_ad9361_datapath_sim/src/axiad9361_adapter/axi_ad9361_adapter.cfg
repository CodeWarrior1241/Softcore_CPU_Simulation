#==============================================================================
# hls_config.cfg
#
# Vitis HLS 2025.2 Configuration File for AXI AD9361 Adapter IP
#
# Usage (command line):
#   C Simulation:  vitis-run --mode hls --csim --config hls_config.cfg --work_dir work
#   C Synthesis:   v++ --compile --mode hls --config hls_config.cfg --work_dir work
#   Co-Simulation: vitis-run --mode hls --cosim --config hls_config.cfg --work_dir work
#   Export IP:     v++ --package --mode hls --config hls_config.cfg --work_dir work
#
# Reference: UG1399 - Vitis HLS User Guide (2025.2)
#==============================================================================

# Target FPGA Part (Ultrascale+ AU15P)
part=xcau15p-ffvb676-2-e

[hls]

#------------------------------------------------------------------------------
# Clock Configuration
#------------------------------------------------------------------------------
# Target clock period in nanoseconds
# 100 MHz = 10ns, matches NEORV32 system clock
clock=10ns

#------------------------------------------------------------------------------
# Flow Target
#------------------------------------------------------------------------------
# vivado = Generate Vivado IP for IP Catalog integration
flow_target=vivado

#------------------------------------------------------------------------------
# Source Files
#------------------------------------------------------------------------------
# Main synthesizable source file
syn.file=axi_ad9361_adapter.cpp

# Header file
syn.file=axi_ad9361_adapter.hpp

# Top-level function name
syn.top=axi_ad9361_adapter

#------------------------------------------------------------------------------
# Testbench Files
#------------------------------------------------------------------------------
tb.file=axi_ad9361_adapter_tb.cpp

#------------------------------------------------------------------------------
# Package/Export Configuration
#------------------------------------------------------------------------------
# Output format: ip_catalog for Vivado IP integration
package.output.format=ip_catalog

# Do not run synthesis during packaging (faster iteration)
package.output.syn=false

#------------------------------------------------------------------------------
# IP Identification
#------------------------------------------------------------------------------
# These settings control the packaged IP metadata
package.ip.vendor=user
package.ip.library=hls
package.ip.name=axi_ad9361_adapter
package.ip.version=1.0

#------------------------------------------------------------------------------
# Synthesis Directives (can also be specified as pragmas in source)
#------------------------------------------------------------------------------
# Interface directives - using pragmas in source file instead
# syn.directive.interface=axi_ad9361_adapter mode=s_axilite port=return bundle=ctrl

# Pipeline the top function
syn.directive.pipeline=axi_ad9361_adapter II=1

# Bind snapshot buffer to BRAM
syn.directive.bind_storage=snap_buffer type=ram_1p impl=bram
